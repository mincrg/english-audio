#gpop{position:fixed;z-index:30;box-sizing:border-box;padding:10px 12px;background:var(--card);color:var(--tx);border:1px solid var(--acc);border-radius:12px;box-shadow:0 6px 22px rgba(0,0,0,.18)}
#gpop .gph{display:flex;align-items:flex-start;gap:8px}#gpop .gpw{flex:1;font-size:18px}#gpop .glem{font-weight:400;color:var(--tx2);font-size:15px}
#gpop .gpk{margin-top:4px;font-size:17px;line-height:1.45}#gpop .gx{flex:none}
.wm .gres{margin:8px 0;font-size:calc(15px*var(--fs,1))}
.wm .gtxt{padding:8px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line);line-height:1.7;white-space:pre-wrap;word-break:break-word}
.wm mark.gerr{background:rgba(230,80,60,.18);color:inherit;border-bottom:2px solid #e5533d;border-radius:3px;padding:0 1px}
.wm ol.glist{margin:8px 0;padding-left:22px}.wm ol.glist li{margin:6px 0}
.wm .gbad{text-decoration:line-through;color:#d33}.wm .gsug{font-weight:700;color:var(--acc)}
.wm .glist button{padding:2px 8px;font-size:13px;margin-left:4px}
.wm .gmsg{display:block;color:var(--tx2);font-size:13px}
</style>
<style>
.witem{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:var(--card)}
.witem.on{background:var(--accs);border-color:var(--acc)}
.witem .wh{display:flex;align-items:flex-start;gap:8px}
.witem .wh .en{flex:1;min-width:0;font-size:calc(17px*var(--fs,1));font-weight:700;word-break:keep-all}
.witem .wh .no{color:var(--tx2);font-size:13px;font-weight:600;margin-right:4px}
.witem .wh .ck{color:var(--ok);font-weight:700;margin-left:4px}
.witem .acts{display:flex;gap:6px;flex:0 0 auto}.witem .acts button{min-width:40px}
.witem .ko{font-size:calc(16px*var(--fs,1));margin:4px 0 6px}
.witem .src{margin:6px 0 4px;padding:6px 10px;border-left:3px solid var(--line);color:var(--tx);font-size:calc(15px*var(--fs,1));line-height:1.55}
.witem .src mark{background:var(--accs);color:var(--acc);font-weight:600;border-radius:4px;padding:0 2px}
.witem .from{font-size:calc(13px*var(--fs,1));color:var(--tx2)}
.wq{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:var(--card)}
.wq .qk{font-size:calc(16px*var(--fs,1));font-weight:600;margin-bottom:6px}
.wq .opts{display:flex;flex-direction:column;gap:6px}
.wq .opts button{text-align:left;font-size:calc(15px*var(--fs,1))}
.wq .opts button.right{background:var(--ok);color:#fff;border-color:var(--ok)}
.wq .opts button.wrong{background:var(--bad);color:#fff;border-color:var(--bad);opacity:.8}
.wq .res{font-size:13px;margin-top:6px}
.sbar .wtitle{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.sbar .wtitle .back{flex:0 0 auto;padding:4px 10px;font-size:14px;text-decoration:none}
.sbar .wtitle .wt{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .wtitle .pc{font-size:12px;font-weight:700;padding:0 6px;border-radius:999px;background:rgba(127,127,127,.16);margin-left:4px}
.sbar .wtitle .gear{flex:0 0 auto;padding:4px 10px;font-size:17px}
</style>
</head>
<body>
<div class="wrap">
<header class="mast">
  <div class="date" id="mdate"></div>
  <h1>📚 주말 복습</h1>
  <p>이번 주에 배운 핵심 표현을 다시 듣고, 뜻을 확인하고, 퀴즈로 마무리해요. 🔊는 영어 → 뜻을 ⚙️에서 정한 횟수·간격대로 읽어 주고, ☆를 누르면 나만의 단어장에 저장돼요.</p>
</header>
<div class="sbar stk" id="sbar">
  <div class="wtitle"><a class="back" href="./../index.html" role="button">← 목록</a><span class="wt" id="wt"></span><button class="gear" id="gear" aria-label="설정">⚙️</button></div>
  <div class="pbar" id="pbar" role="progressbar" aria-label="복습 진도" aria-valuemin="0" aria-valuemax="11"><i></i></div>
  <div class="tabs" id="tabs" role="tablist"><button data-t="list" class="on" role="tab">📋 표현 <span id="ckl" class="ck"></span></button><button data-t="quiz" role="tab">📝 퀴즈 <span id="ckq" class="ck"></span></button></div>
</div>
<section class="box" id="listv">
  <div class="player ctl" id="wctl">
    <div class="crow">
      <button class="pri pp" id="wpp" aria-label="전체 재생/일시정지">▶</button>
      <button id="wstop" aria-label="정지">⏹</button>
      <button id="wprev" aria-label="이전">⏮</button>
      <button id="wnext" aria-label="다음">⏭</button>
      <div class="now" id="wnow"></div>
    </div>
    <div class="crow2"><button class="chip" id="wchip" aria-label="재생 설정 열기"></button></div>
  </div>
  <div id="list"></div>
</section>
<section class="box" id="quizv" hidden>
  <div class="note">한국어 뜻을 보고 알맞은 영어 표현을 고르세요. 틀리면 다시 고를 수 있어요. 모두 맞히면 ✓ 표시가 붙어요.</div>
  <div id="quiz"></div>
  <div class="row"><button id="qnew">🔀 새 문제</button></div>
</section>
<section class="box">
  <div class="toplinks"><a class="card" href="../index.html"><b>📚 전체 학습 목록</b></a><a class="card" href="../wordbook.html"><b>⭐ 나만의 단어장</b><small id="wbcount"></small></a></div>
  <div class="row"><button id="preset">↺ 이 복습 진도 초기화</button></div>
</section>
<p class="note">음성: Microsoft Edge 신경망 음성(영어 Ava, 한국어 SunHi)으로 미리 만든 mp3입니다.</p>
</div>
<div id="sheetbg"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-label="설정"></div>
<script src="../wb.js?v=ab1a2742e1"></script>
<script>
const W = {"date": "2026-11-01", "from": "2026-10-26", "to": "2026-10-31", "label": "주말 복습 (10/26~10/31)", "range": "10/26~10/31", "dateLine": "2026년 11월 1일 일요일 · 10/26~10/31 핵심 표현 10개", "items": [{"en": "better-than-expected", "ko": "예상보다 좋은", "date": "2026-10-26", "dlabel": "10/26(월)", "art": 1, "title": "Tesla Beats Expectations, but Car Sales Slow Down", "sentence": "Tesla reported better-than-expected results for the third quarter on Wednesday, even though money from selling cars fell by 3% compared with a year earlier.", "hl": "", "url": ""}, {"en": "the largest deal of its kind", "ko": "(같은 종류 중) 가장 큰 거래", "date": "2026-10-27", "dlabel": "10/27(화)", "art": 1, "title": "SpaceX Gets 40 Billion Dollars for AI Chips", "sentence": "SpaceX said on Monday that it had agreed to a deal worth about 40 billion dollars to get new computer chips for artificial intelligence, and the company called it the largest deal of its kind ever.", "hl": "", "url": ""}, {"en": "room to grow", "ko": "성장할 여지", "date": "2026-10-28", "dlabel": "10/28(수)", "art": 1, "title": "Palantir Gets a Higher Price Target Before Its Earnings", "sentence": "That new target is about 31 percent above Monday's closing price, so the firm believes the shares still have room to grow.", "hl": "", "url": ""}, {"en": "come in below expectations", "ko": "예상에 못 미치다", "date": "2026-10-29", "dlabel": "10/29(목)", "art": 2, "title": "Google's Parent Company Grows Fast but Spends Heavily on AI", "sentence": "Search revenue also came in below expectations, so Alphabet's shares fell more than seven percent after the report.", "hl": "came in below expectations", "url": ""}, {"en": "at a yearly pace of", "ko": "연간 ~의 속도로", "date": "2026-10-30", "dlabel": "10/30(금)", "art": 1, "title": "The US Economy Grows Faster Than Expected", "sentence": "The American economy grew at a yearly pace of three point four percent from July to September, which was faster than the three point two percent that economists had expected and much faster than the two point two percent in the spring.", "hl": "", "url": ""}, {"en": "a rate hike", "ko": "금리 인상", "date": "2026-10-30", "dlabel": "10/30(금)", "art": 1, "title": "The US Economy Grows Faster Than Expected", "sentence": "The Federal Reserve kept interest rates between three point seven five and four percent on Wednesday, but two officials wanted to raise them, so many traders now expect a rate hike in December.", "hl": "", "url": ""}, {"en": "pay off", "ko": "성과를 내다, 결실을 맺다", "date": "2026-10-30", "dlabel": "10/30(금)", "art": 2, "title": "Amazon's Cloud Grows Fast, but Its Shares Fall", "sentence": "Since Google's parent company had disappointed investors just one day earlier, many people are now asking whether the giant AI spending by big tech companies will really pay off.", "hl": "", "url": ""}, {"en": "just in time for", "ko": "~에 딱 맞춰", "date": "2026-10-31", "dlabel": "10/31(토)", "art": 1, "title": "The World's Heaviest Jack-o'-Lantern", "sentence": "Just in time for Halloween, the heaviest pumpkin ever grown has become the heaviest jack-o'-lantern in the world.", "hl": "", "url": "../2026-10-31/index.html"}, {"en": "beat the record", "ko": "기록을 깨다", "date": "2026-10-31", "dlabel": "10/31(토)", "art": 1, "title": "The World's Heaviest Jack-o'-Lantern", "sentence": "It easily beat the old record from twenty twenty-three, which was two thousand seven hundred forty-nine pounds, so the new jack-o'-lantern is now about as heavy as a small car.", "hl": "beat the old record", "url": "../2026-10-31/index.html"}, {"en": "would not have been possible without", "ko": "~없이는 불가능했을 것이다", "date": "2026-10-31", "dlabel": "10/31(토)", "art": 2, "title": "AI Helps Scientists Count Rare Bats", "sentence": "Scientists in Britain have finished the country's largest ever survey of woodland bats, and they say it would not have been possible without artificial intelligence.", "hl": "", "url": "../2026-10-31/index.html"}]};
fetch("../days.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{ const me=j&&(j.weeklies||[]).find(x=>x.date===W.date); if(me&&me.build&&me.build!=="4fabf6c2ab") freshen(me.build); }).catch(()=>{});
const esc = WB.esc, $ = id => document.getElementById(id);
const clipUrl = i => new URL(`${W.date}/clips/rq${i+1}.mp3`, location.href).href;   // WB plays rqN-en.mp3 then rqN-ko.mp3
const idOf = i => "wk"+W.date+"-"+(i+1);
/* ---- progress: {date:{heard:[i...], quiz:true}} */
const PKEY="ea-wprog-v1";
function pAll(){ try{ return JSON.parse(localStorage.getItem(PKEY)||"{}")||{}; }catch(e){ return {}; } }
function pMe(){ const p=pAll()[W.date]||{}; return {heard:Array.isArray(p.heard)?p.heard:[], quiz:!!p.quiz}; }
function pSet(fn){ const a=pAll(), m=pMe(); fn(m); a[W.date]=m; try{ localStorage.setItem(PKEY, JSON.stringify(a)); }catch(e){} drawProg(); }
function heard(i){ if(!pMe().heard.includes(i)) pSet(m=>m.heard.push(i)); }
function drawProg(){ const m=pMe(), n=W.items.length, h=m.heard.filter(i=>i<n).length, tot=h+(m.quiz?1:0), all=n+1;
  $("wt").innerHTML = `📚 복습 ${esc(W.range)}<span class="pc">${tot>=all?"✅":tot+"/"+all}</span>`;
  $("pbar").querySelector("i").style.width = (tot/all*100)+"%"; $("pbar").setAttribute("aria-valuenow", tot); $("pbar").setAttribute("aria-valuemax", all);
  $("ckl").textContent = h>=n ? "✓" : ""; $("ckq").textContent = m.quiz ? "✓" : "";
  document.querySelectorAll(".witem").forEach(el=>{ const c=el.querySelector(".ck"); if(c) c.textContent = m.heard.includes(+el.dataset.i) ? "✓" : ""; }); }
$("preset").onclick=()=>{ if(confirm("이 주말 복습의 진도 표시를 지울까요?")){ const a=pAll(); delete a[W.date]; try{ localStorage.setItem(PKEY, JSON.stringify(a)); }catch(e){} drawProg(); newQuiz(); } };
/* ---- list */
function hl(s, h){ const t=esc(s); if(!h) return t; const k=t.toLowerCase().indexOf(esc(h).toLowerCase()); return k<0 ? t : t.slice(0,k)+"<mark>"+t.slice(k,k+esc(h).length)+"</mark>"+t.slice(k+esc(h).length); }
function from(x){ const where=`${esc(x.dlabel)} 기사 ${x.art}`; return x.url ? `${where} · <a href="${esc(x.url)}">${esc(x.title)}</a>` : `${where} · ${esc(x.title)}`; }
function drawList(){
  $("list").innerHTML = W.items.map((x,i)=>`<div class="witem" data-i="${i}" id="w${i+1}">
    <div class="wh"><div class="en"><span class="no">${i+1}</span>${esc(x.en)}<span class="ck"></span></div>
      <div class="acts"><button class="ico" data-play="${i}" aria-label="듣기">${WB.isPlaying(idOf(i))?"⏸":"🔊"}</button>${WB.starHTML({type:"expr",en:x.en,ko:x.ko,ex:x.sentence||"",date:x.date,article:x.title,clip:clipUrl(i),page:x.url?new URL(x.url,location.href).href:location.href.split("#")[0]})}</div></div>
    <div class="ko">${esc(x.ko)}</div>
    ${x.sentence?`<div class="src">${hl(x.sentence, x.hl||x.en)}</div>`:""}
    <div class="from">${from(x)}</div></div>`).join("");
  drawProg(); drawCtl(); }
const plist = () => W.items.map((x,i)=>({id:idOf(i), url:clipUrl(i)}));
$("list").addEventListener("click", e=>{ const b=e.target.closest("button[data-play]"); if(!b) return; const i=+b.dataset.play; WB.play(clipUrl(i), idOf(i)); });
$("wpp").onclick=()=>WB.toggleList(plist()); $("wstop").onclick=()=>WB.stop();
$("wprev").onclick=()=>WB.jump(plist(),-1); $("wnext").onclick=()=>WB.jump(plist(),1);
function drawCtl(){ const st=WB.listState(); $("wpp").textContent = st.active&&!st.paused ? "⏸" : "▶";
  const i = st.active ? plist().findIndex(x=>x.id===st.id) : -1;
  $("wnow").innerHTML = i>=0 ? `<b>${st.li+1}/${st.n}</b> ${esc(W.items[i].en)}` : `<b>전체 ${W.items.length}개</b> 듣기`;
  document.querySelectorAll(".witem").forEach(el=>{ const on=WB.isPlaying(idOf(+el.dataset.i)); el.classList.toggle("on",on);
    const b=el.querySelector("button[data-play]"); if(b) b.textContent = on ? "⏸" : "🔊"; });
  // anything that started playing counts as heard
  W.items.forEach((x,i)=>{ if(WB.isPlaying(idOf(i))) heard(i); }); }
/* ---- quiz: KO → EN multiple choice */
const QN=Math.min(5, W.items.length); let Q=[];
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function newQuiz(){ const idx=shuffle(W.items.map((_,i)=>i)).slice(0,QN);
  Q = idx.map(i=>({i, opts:shuffle([i, ...shuffle(W.items.map((_,k)=>k).filter(k=>k!==i)).slice(0,2)]), tried:[], ok:false})); drawQuiz(); }
function drawQuiz(){ const done=Q.filter(q=>q.ok).length, first=Q.filter(q=>q.ok&&q.tried.length===1).length;
  $("quiz").innerHTML = Q.map((q,n)=>`<div class="wq" data-q="${n}"><div class="qk">${n+1}. ${esc(W.items[q.i].ko)}</div>
    <div class="opts">${q.opts.map(k=>`<button data-k="${k}" class="${q.tried.includes(k)?(k===q.i?"right":"wrong"):""}" ${q.ok?"disabled":""}>${esc(W.items[k].en)}</button>`).join("")}</div>
    ${q.ok?`<div class="res okc">⭕ 정답 <button class="ico" data-play="${q.i}" aria-label="듣기">🔊</button></div>`:q.tried.length?`<div class="res badc">❌ 다시 골라 보세요</div>`:""}</div>`).join("")
    + (done===Q.length ? `<div class="note okc">🎉 ${Q.length}문제 모두 맞혔어요 (한 번에 맞힌 문제 ${first}개)</div>` : `<div class="note">${done}/${Q.length} 정답</div>`); }
$("quiz").addEventListener("click", e=>{ const p=e.target.closest("button[data-play]"); if(p){ const i=+p.dataset.play; WB.play(clipUrl(i), idOf(i)); return; }
  const b=e.target.closest("button[data-k]"); if(!b) return; const q=Q[+b.closest(".wq").dataset.q], k=+b.dataset.k; if(q.ok||q.tried.includes(k)) return;
  q.tried.push(k); if(k===q.i) q.ok=true; drawQuiz(); if(Q.every(x=>x.ok)) pSet(m=>m.quiz=true); });
$("qnew").onclick=newQuiz;
/* ---- tabs */
$("tabs").addEventListener("click", e=>{ const b=e.target.closest("button[data-t]"); if(!b) return;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
  $("listv").hidden = b.dataset.t!=="list"; $("quizv").hidden = b.dataset.t!=="quiz";
  (function(){ const w=document.querySelector(".wrap"); const top=Math.max(0,$("sbar").offsetTop); if(w) w.scrollTo({top,behavior:"auto"}); else window.scrollTo({top,behavior:"auto"}); })(); });
/* ---- ⚙️ sheet: speed, text size, EN→KO repeat/gap (shared keys with the day pages) */
const FS_KEY="ea-fs-v1", FSS=[0.9,1,1.15,1.3], FSL=["작게","보통","크게","아주 크게"];
function fsG(){ try{ const v=parseFloat(localStorage.getItem(FS_KEY)); return FSS.includes(v)?v:1; }catch(e){ return 1; } }
function stepFs(d){ const i=Math.max(0,Math.min(FSS.length-1,FSS.indexOf(fsG())+d)); try{ localStorage.setItem(FS_KEY,String(FSS[i])); }catch(e){} document.documentElement.style.setProperty("--fs",FSS[i]); syncSettings(); }
const sheet=$("sheet"), sheetbg=$("sheetbg"), sheetOpen=()=>sheet.classList.contains("open");
function drawSheet(){ const fi=FSS.indexOf(fsG()), m=pMe();
  const seg=(cls,arr,cur,lab,fn)=>`<span class="seg">${arr.map(v=>`<button class="${cls}${v===cur?" on":""}" aria-pressed="${v===cur}" onclick="${fn}(${v})">${lab(v)}</button>`).join("")}</span>`;
  sheet.innerHTML=`<div class="grab"></div><div class="shd"><h4>⚙️ 설정</h4><button onclick="closeSheet()">✕ 닫기</button></div>
  <div class="sg"><div class="sl">공통</div>
    <div class="sr"><span class="lab">재생 속도</span>${seg("srt",WB.RATES,WB.rate(),v=>v.toFixed(1)+"x","WB.setRate")}</div>
    <div class="sr"><span class="lab">글자 크기</span><button class="fsm" aria-label="글자 작게" onclick="stepFs(-1)" ${fi<=0?"disabled":""}>가-</button><span class="fsz">${FSL[fi]}</span><button class="fsp" aria-label="글자 크게" onclick="stepFs(1)" ${fi>=FSS.length-1?"disabled":""}>가+</button></div></div>
  <div class="sg"><div class="sl">표현 듣기 (영어 → 뜻)</div>
    <div class="sr"><span class="lab">반복</span>${seg("rp",WB.REPS,WB.reps(),v=>v+"회","WB.setReps")}</div>
    <div class="sr"><span class="lab">간격(초)</span>${seg("gp",WB.GAPS,WB.gap(),v=>String(v),"WB.setGap")}</div></div>
  <div class="sg"><div class="sl">진도</div><div class="note">들은 표현 ${m.heard.length}/${W.items.length} · 퀴즈 ${m.quiz?"✓ 완료":"아직"}</div></div>`; }
function openSheet(){ drawSheet(); sheet.classList.add("open"); sheetbg.classList.add("open"); document.body.classList.add("sheet-open"); }
function closeSheet(){ sheet.classList.remove("open"); sheetbg.classList.remove("open"); document.body.classList.remove("sheet-open"); }
function syncSettings(){ $("wchip").textContent=`⚙️ 반복 ${WB.reps()}회 · 간격 ${WB.gap()}초 · ${WB.rate().toFixed(1)}x`; if(sheetOpen()) drawSheet(); }
sheetbg.onclick=closeSheet; $("gear").onclick=()=>openSheet(); $("wchip").onclick=()=>openSheet();
addEventListener("keydown",e=>{ if(e.key==="Escape"&&sheetOpen()) closeSheet(); });
addEventListener("storage",e=>{ if(e.key===FS_KEY) document.documentElement.style.setProperty("--fs",fsG()); if(e.key===PKEY) drawProg(); });
WB.onGap=syncSettings; syncSettings();
{ const sb=$("sbar"), set=()=>{ $("wctl").style.top=sb.offsetHeight+"px"; }; set(); addEventListener("resize",set); }
$("mdate").textContent = W.dateLine;
const cnt=()=>{ const n=WB.all().length; $("wbcount").textContent = n? `저장 ${n}개` : "아직 비어 있어요"; };
WB.onChange(()=>{ cnt(); WB.refreshStars(); drawCtl(); }); cnt();
drawList(); newQuiz();
</script>

</body>
