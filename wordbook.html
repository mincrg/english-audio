.cvd{margin:8px 0 4px}.cvl{display:flex;gap:8px;align-items:flex-start;margin:10px 0}.cvl.B{flex-direction:row-reverse}

/* 🔎 문장 분석 (article.analysis; 직해 view) */
.ap{--c:#7f8c8d}.ap-S{--c:#1a5fd6}.ap-V{--c:#d93025}.ap-O{--c:#1e8e3e}.ap-C{--c:#8e44ad}.ap-M{--c:#7f8c8d}.ap-REL{--c:#00897b}.ap-PART{--c:#e67e22}.ap-CONJ{--c:#b8860b}
@media (prefers-color-scheme:dark){.ap-S{--c:#8ab4f8}.ap-V{--c:#f28b82}.ap-O{--c:#81c995}.ap-C{--c:#c58af9}.ap-REL{--c:#4dd0c4}.ap-PART{--c:#fcad70}.ap-CONJ{--c:#e6c35c}}

.apt{position:absolute;margin-top:calc(37px*var(--fs,1));font-size:calc(11px*var(--fs,1));line-height:1.15;font-weight:700;color:var(--c);white-space:nowrap;letter-spacing:-.01em;background:var(--card);padding:0 2px 0 0;border-radius:3px;pointer-events:none;user-select:none;-webkit-user-select:none}

.anleg{display:flex;flex-wrap:wrap;gap:4px 10px;margin:4px 0 8px;font-size:12px;color:var(--tx2)}.anleg span{display:inline-flex;align-items:center;gap:4px}.anleg i{display:inline-block;width:14px;height:3px;background:var(--c);border-radius:2px}

/* no accidental text selection on study chrome / 직해 (Apple Pencil and finger taps on iPad Safari otherwise leave a stuck highlight + 복사하기 menu) */
button, nav.toc a, .artsw, .tabs, .seg, .modebar, .sbar, .ctl, .chip, .anleg, .cvbt, .cvav, .gw, .dw{
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ko,.sen-ko,.anote,.cvk,.exk,.jiklines,.jiklines *{
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
</style>

<style>

body.wb-sel .item.picked label.pick .tick{background:var(--acc);border-color:var(--acc)}

  body.wb-sel .item:not(.ihdr){grid-template-columns:44px 1fr auto;grid-template-areas:"pick w acts" "pick mean mean" "pick ex ex"}

<body>
<div class="wrap">
<header class="mast">
  <div class="date wbtop"><a href="./index.html" style="color:inherit">← 전체 학습 목록</a><button class="gear" id="gear" aria-label="설정">⚙️</button></div>
  <h1>⭐ 나만의 단어장</h1>
  <p>날짜별 페이지에서 ☆로 저장한 단어·표현·회화가 모여요. 🔊는 영어 → 뜻을 읽고, ▶로 전체 듣기, ⚙️에서 반복·간격·속도·글자 크기를 정해요.</p>
</header>
<section class="box">
  <span class="seg" id="filt"></span>
  <div id="modesrow">
    <span class="seg" id="modes"><button data-m="list" class="on">📋 목록</button><button data-m="quiz">📝 복습 퀴즈</button></span>
    <button type="button" id="selbtn" aria-pressed="false">선택</button>
  </div>
  <div id="cnt" class="note"></div>
  <div id="selbar" hidden>
    <button type="button" id="selall">전체 선택</button>
    <span id="seln">0개 선택</span>
    <button type="button" class="seldel" id="seldel" disabled>선택 삭제 (0)</button>
    <button type="button" id="selcancel">취소</button>
  </div>
  <div class="player ctl stk" id="wbctl">
    <div class="crow">
      <button class="pri pp" id="wbpp" aria-label="전체 재생/일시정지">▶</button>
      <button id="wbstop" aria-label="정지">⏹</button>
      <button id="wbprev" aria-label="이전">⏮</button>
      <button id="wbnext" aria-label="다음">⏭</button>
      <div class="now" id="wbnow"></div>
    </div>
    <div class="crow2"><button class="chip" id="wbchip" aria-label="재생 설정 열기"></button></div>
    <div class="bar"><i></i></div>
  </div>
  <div id="list"></div>
  <div id="quiz" hidden></div>
</section>
<section class="box">
  <h3 style="border:0;margin-top:0;padding-top:0">백업 · 옮기기</h3>
  <div class="note">단어장은 이 기기의 이 브라우저에만 저장돼요. 내보내기로 글자를 복사해 메모 등에 보관하고, 다른 기기에서 가져오기에 붙여 넣으면 합쳐집니다.</div>
  <div class="row"><button id="exp">⬆ 내보내기</button><button id="copy">📋 복사</button><button id="imp">⬇ 가져오기</button></div>
  <textarea id="io" rows="6" style="width:100%;font:13px/1.4 ui-monospace,monospace;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px" placeholder="내보내기를 누르면 여기에 백업 글자가 나와요. 가져오려면 백업 글자를 붙여 넣고 가져오기를 누르세요."></textarea>
  <div id="iomsg" class="note"></div>
</section>
</div>
<div id="sheetbg"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-label="설정"></div>
<script src="./wb.js?v=7ca4fe584c"></script>
<script>fetch("./days.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{ const v=j&&j.assets&&j.assets.wordbook; if(v&&v!=="70205d702f") freshen(v); }).catch(()=>{});</script>
<script>
const esc = WB.esc;
const FILT_KEY="ea-wb-filt-v1", FILTS=["all","word","expr","conv"];
const FILT_OLD={article:"all"};   // 예전 '📰 단어·표현' 합침 필터 → 전체
function filtG(){ try{ let v=localStorage.getItem(FILT_KEY); if(FILT_OLD[v]){ v=FILT_OLD[v]; try{ localStorage.setItem(FILT_KEY,v); }catch(e){} } return FILTS.includes(v)?v:"all"; }catch(e){ return "all"; } }
let filt=filtG(), mode="list", qz=null, selecting=false, selected=new Set();
function setFilt(f){ if(!FILTS.includes(f)) return; filt=f; try{ localStorage.setItem(FILT_KEY,f); }catch(e){} }
/* ⚙️ settings sheet: speed, EN↔KO repeat/gap, text size (same keys as the day pages) */
const FS_KEY="ea-fs-v1", FSS=[0.9,1,1.15,1.3], FSL=["작게","보통","크게","아주 크게"];
function fsG(){ try{ const v=parseFloat(localStorage.getItem(FS_KEY)); return FSS.includes(v)?v:1; }catch(e){ return 1; } }
function stepFs(d){ const i=Math.max(0,Math.min(FSS.length-1,FSS.indexOf(fsG())+d)); try{ localStorage.setItem(FS_KEY,String(FSS[i])); }catch(e){} document.documentElement.style.setProperty("--fs",FSS[i]); syncSettings(); }
const sheet=document.getElementById("sheet"), sheetbg=document.getElementById("sheetbg");
const sheetOpen=()=>sheet.classList.contains("open");
function drawSheet(){ const fi=FSS.indexOf(fsG());
  const seg=(cls,arr,cur,lab,fn)=>`<span class="seg">${arr.map(v=>`<button class="${cls}${v===cur?" on":""}" aria-pressed="${v===cur}" onclick="${fn}(${v})">${lab(v)}</button>`).join("")}</span>`;
  sheet.innerHTML=`<div class="grab"></div><div class="shd"><h4>⚙️ 설정</h4><button onclick="closeSheet()">✕ 닫기</button></div>
  <div class="sg"><div class="sl">공통</div>
    <div class="sr"><span class="lab">재생 속도</span>${seg("srt",WB.RATES,WB.rate(),v=>v.toFixed(1)+"x","WB.setRate")}</div>
    <div class="sr"><span class="lab">글자 크기</span><button class="fsm" aria-label="글자 작게" onclick="stepFs(-1)" ${fi<=0?"disabled":""}>가-</button><span class="fsz">${FSL[fi]}</span><button class="fsp" aria-label="글자 크게" onclick="stepFs(1)" ${fi>=FSS.length-1?"disabled":""}>가+</button></div></div>
  <div class="sg"><div class="sl">단어·표현 듣기 (영어 → 뜻)</div>
    <div class="sr"><span class="lab">반복</span>${seg("rp",WB.REPS,WB.reps(),v=>v+"회","WB.setReps")}</div>
    <div class="sr"><span class="lab">간격(초)</span>${seg("gp",WB.GAPS,WB.gap(),v=>String(v),"WB.setGap")}</div></div>`; }
function openSheet(){ drawSheet(); sheet.classList.add("open"); sheetbg.classList.add("open"); document.body.classList.add("sheet-open"); }
function closeSheet(){ sheet.classList.remove("open"); sheetbg.classList.remove("open"); document.body.classList.remove("sheet-open"); }
function syncSettings(){ document.getElementById("wbchip").textContent=`⚙️ 반복 ${WB.reps()}회 · 간격 ${WB.gap()}초 · ${WB.rate().toFixed(1)}x`; if(sheetOpen()) drawSheet(); }
sheetbg.onclick=closeSheet; document.getElementById("gear").onclick=()=>openSheet(); document.getElementById("wbchip").onclick=()=>openSheet();
addEventListener("keydown",e=>{ if(e.key==="Escape"&&sheetOpen()) closeSheet(); });
addEventListener("storage",e=>{ if(e.key===FS_KEY) document.documentElement.style.setProperty("--fs",fsG()); });
WB.onGap=syncSettings; syncSettings();
// play-all bar: plays the list as currently shown (filter applied), top to bottom
const shown = () => WB.all().filter(x=>WB.matchFilt(x,filt)).map(x=>({id:x.id, url:WB.resolveClip(x)})).filter(x=>x.url);
document.getElementById("wbpp").onclick = () => WB.toggleList(shown());
document.getElementById("wbstop").onclick = () => { WB.stop(); ttsStop(); };
document.getElementById("wbprev").onclick = () => WB.jump(shown(), -1);
document.getElementById("wbnext").onclick = () => WB.jump(shown(), 1);
function drawCtl(){ const st=WB.listState(), items=WB.all().filter(x=>WB.matchFilt(x,filt)), n=items.filter(x=>WB.hasClip(x)).length;
  document.getElementById("wbctl").hidden = mode!=="list" || !n;
  document.getElementById("wbpp").textContent = st.active && !st.paused ? "⏸" : "▶";
  const it = st.active ? items.find(x=>x.id===st.id) : null;
  document.getElementById("wbnow").innerHTML = it ? `<b>${st.li+1}/${st.n}</b> ${esc(it.en)}` : `<b>전체 ${n}개</b> 듣기`;
  document.querySelectorAll("#list .item[data-id]").forEach(r=>r.classList.toggle("on", WB.isPlaying(r.dataset.id))); }
/* clip-less rows: WB.ttsSay(en,ko,id) does EN→KO × reps with gap (see wb.js). */
function ttsStop(){ WB.ttsStop(); }
WB.onPlay = () => WB.ttsStop();
function emptyNote(all){
  if(!all.length) return "아직 비어 있어요. 날짜별 페이지의 주요 어휘·중요 표현 표나 회화 탭의 🗣 회화 표현 카드에서 ☆를 눌러 저장해 보세요.";
  if(filt==="word") return "저장한 단어가 없어요. 어휘 표나 원문·직해에서 단어를 탭해 ☆를 눌러 보세요.";
  if(filt==="expr") return "저장한 표현이 없어요. 중요 표현 표에서 ☆를 눌러 보세요.";
  if(filt==="conv") return "저장한 회화 표현이 없어요. 회화 탭의 🗣 회화 표현 카드에서 ☆를 눌러 보세요.";
  return "이 종류로 저장한 항목이 없어요.";
}
function countsOf(all){
  const n={word:0,expr:0,conv:0}; all.forEach(x=>n[WB.kind(x)]++); return n;
}
function drawFilt(){
  const all=WB.all(), n=countsOf(all);
  const tabs=[["all","전체",all.length],["word","🔤 단어",n.word],["expr","📰 표현",n.expr],["conv","💬 회화",n.conv]];
  document.getElementById("filt").innerHTML = tabs.map(([f,l,c])=>`<button data-f="${f}" class="${filt===f?"on":""}" aria-pressed="${filt===f}">${l}<span class="n">${c}</span></button>`).join("");
}
function visibleIds(){ return WB.all().filter(x=>WB.matchFilt(x,filt)).map(x=>x.id); }
function selCount(){ return visibleIds().filter(id=>selected.has(id)).length; }
function drawSel(){
  const on=selecting && mode==="list";
  document.body.classList.toggle("wb-sel", on);
  document.getElementById("selbtn").classList.toggle("on", on);
  document.getElementById("selbtn").setAttribute("aria-pressed", on?"true":"false");
  document.getElementById("selbtn").textContent = on ? "선택 중" : "선택";
  document.getElementById("selbtn").hidden = mode!=="list";
  document.getElementById("selbar").hidden = !on;
  if(!on) return;
  const items=visibleIds(), n=items.filter(id=>selected.has(id)).length, allOn=items.length>0 && items.every(id=>selected.has(id));
  document.getElementById("selall").textContent = allOn ? "선택 해제" : "전체 선택";
  document.getElementById("seln").textContent = n ? `${n}개 선택` : "선택한 항목 없음";
  const del=document.getElementById("seldel"); del.disabled=!n; del.textContent=`선택 삭제 (${n})`;
  document.querySelectorAll("#list .item[data-id]").forEach(r=>{
    const onI=selected.has(r.dataset.id); r.classList.toggle("picked", onI);
    const c=r.querySelector("input[type=checkbox]"); if(c) c.checked=onI;
  });
}
function setSelecting(on){
  selecting=!!on;
  if(!selecting) selected=new Set();
  if(mode!=="list") selecting=false;
  drawList(); drawCtl();
}
function toggleSel(id){ if(selected.has(id)) selected.delete(id); else selected.add(id); drawSel(); }
function drawList(){
  const all=WB.all(), items=all.filter(x=>WB.matchFilt(x,filt)), n=countsOf(all);
  drawFilt();
  document.getElementById("cnt").textContent = `저장 ${all.length}개 (단어 ${n.word} · 표현 ${n.expr} · 회화 ${n.conv})` + (filt==="all"?"":` · 지금 목록 ${items.length}개`);
  if(mode!=="list"){ drawSel(); return; }
  document.getElementById("list").innerHTML = items.length ? `<div class="items"><div class="item ihdr"><label class="pick"></label><div class="w">영어</div><div class="mean">뜻</div><div class="ex">기사 · 날짜</div><div class="acts"></div></div>` + items.map(x=>{ const k=WB.kind(x), on=selected.has(x.id); return `<div class="item ${k}${on?" picked":""}" data-id="${esc(x.id)}">
    <label class="pick"><input type="checkbox" ${on?"checked":""} data-sid="${esc(x.id)}" aria-label="${esc(x.en)} 선택"><span class="tick"></span></label>
    <div class="w"><span class="cbadge" title="${WB.kindLabel(x)}">${WB.kindBadge(x)}</span><b>${esc(x.en)}</b><span class="pos">${WB.kindLabel(x)}${x.pos?" · "+esc(x.pos):""}</span></div>
    <div class="acts"><button class="ico" data-play="${esc(x.id)}" aria-label="듣기">${WB.isPlaying(x.id)||WB.isTts(x.id)?"⏹ 정지":"🔊"}</button><button class="ico" data-del="${esc(x.id)}" aria-label="삭제">🗑</button></div>
    <div class="mean">${esc(x.ko)}</div>
    <div class="ex">${x.ex?esc(x.ex)+"<br>":""}${x.article?esc(x.article)+" · ":""}${x.date?(x.page?`<a href="${esc(x.page)}">${esc(x.date)}</a>`:esc(x.date)):""}</div></div>`; }).join("") + `</div>`
    : `<div class="note">${emptyNote(all)}</div>`;
  drawSel();
}
document.getElementById("list").addEventListener("click", e=>{
  const all=WB.all();
  const b=e.target.closest("button");
  if(b){
    if(b.dataset.play){ const x=all.find(i=>i.id===b.dataset.play); if(x) WB.playItem(x, x.id); return; }
    if(b.dataset.del){ const x=all.find(i=>i.id===b.dataset.del); if(x && confirm(`'${x.en}'을(를) 단어장에서 뺄까요?`)) WB.remove(x.id); return; }
  }
  if(selecting && mode==="list"){
    if(e.target.closest("a")) return;
    const row=e.target.closest(".item[data-id]"); if(row) toggleSel(row.dataset.id);
  }
});
document.getElementById("selbtn").addEventListener("click", ()=> setSelecting(!selecting));
document.getElementById("selcancel").addEventListener("click", ()=> setSelecting(false));
document.getElementById("selall").addEventListener("click", ()=>{
  const ids=visibleIds();
  if(ids.length && ids.every(id=>selected.has(id))) ids.forEach(id=>selected.delete(id));
  else ids.forEach(id=>selected.add(id));
  drawSel();
});
document.getElementById("seldel").addEventListener("click", ()=>{
  const ids=visibleIds().filter(id=>selected.has(id)); if(!ids.length) return;
  if(!confirm(`선택한 ${ids.length}개를 단어장에서 뺄까요?`)) return;
  const removed=WB.removeMany(ids);
  ids.forEach(id=>selected.delete(id));
  if(!removed.length) return;
  setSelecting(false);
  WB.toast(`${removed.length}개를 삭제했어요`, {action:"실행 취소", ms:5500, onAction:()=>WB.restoreMany(removed)});
});
document.getElementById("filt").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b||!b.dataset.f) return; setFilt(b.dataset.f);
  if(qz) qz.setType(filt); drawList(); drawCtl(); });
document.getElementById("modes").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; mode=b.dataset.m;
  document.querySelectorAll("#modes button").forEach(x=>x.classList.toggle("on",x===b));
  document.getElementById("list").hidden = mode!=="list"; document.getElementById("quiz").hidden = mode!=="quiz";
  if(mode!=="list") setSelecting(false);
  if(mode==="quiz"){ if(!qz) qz=WB.quiz(document.getElementById("quiz"),{limit:10,type:filt}); else qz.setType(filt); }
  drawList(); drawCtl(); });
const io=document.getElementById("io"), msg=t=>document.getElementById("iomsg").textContent=t;
document.getElementById("exp").onclick=()=>{ io.value=WB.exportText(); io.select(); msg(`${WB.all().length}개를 내보냈어요. 복사해서 보관하세요.`); };
document.getElementById("copy").onclick=()=>{ if(!io.value) io.value=WB.exportText(); io.select();
  (navigator.clipboard?navigator.clipboard.writeText(io.value):Promise.reject()).then(()=>msg("복사했어요."),()=>{ document.execCommand&&document.execCommand("copy"); msg("글자를 선택했어요. 복사해 주세요."); }); };
document.getElementById("imp").onclick=()=>{ try{ const n=WB.importText(io.value.trim()); msg(`${n}개를 새로 가져왔어요 (이미 있던 항목은 건너뜀).`); }catch(e){ msg("가져오기 실패: "+e.message); } };
WB.onChange(drawList); WB.onChange(drawCtl); drawList(); drawCtl();
WB.loadClips().then(()=>{ drawList(); drawCtl(); });
</script>

</body>
</html>
