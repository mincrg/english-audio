<!doctype html>
<html lang="ko">
<head>
<meta http-equiv="Cache-Control" content="no-cache">
<script>function freshen(v){ try{ const u=new URL(location.href); if(u.searchParams.get("v")===v) return; u.searchParams.set("v",v); location.replace(u.href); }catch(e){} }</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나만의 단어장 · 영어 직독직해</title>
<style>
:root{--bg:#fafaf8;--card:#fff;--tx:#1b1b1b;--tx2:#5f6368;--line:#e4e4e0;--acc:#1a5fd6;--accs:#e8f0fe;--ok:#1e8e3e;--bad:#d93025;--btn:#f1f3f4}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1c1c1e;--tx:#ececec;--tx2:#a0a4a8;--line:#2e2e30;--acc:#8ab4f8;--accs:#1f2a3d;--ok:#81c995;--bad:#f28b82;--btn:#2a2a2d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px calc(80px + env(safe-area-inset-bottom))}
header.mast{border-bottom:3px double var(--tx);padding:6px 0 10px;margin-bottom:14px}
.mast .date{font-size:13px;color:var(--tx2);letter-spacing:.04em}
.mast h1{font:700 28px/1.2 Georgia,"Times New Roman",serif;margin:4px 0}
.mast p{margin:4px 0 0;color:var(--tx2);font-size:15px}
nav.toc{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 18px}
nav.toc a{font-size:14px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--tx);text-decoration:none;background:var(--card)}
section.art,section.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:18px 0}
.kicker{font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.03em}
h2{font:700 24px/1.25 Georgia,serif;margin:4px 0 2px}
.sub{color:var(--tx2);font-size:15px;margin-bottom:10px}
h3{font-size:18px;margin:22px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--btn);color:var(--tx);border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
@media (prefers-color-scheme:dark){button.pri{color:#111}}
button:disabled{opacity:.4}
button.ico{padding:6px 9px;min-width:40px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0 10px}
.seg button{border:0;border-radius:0;background:transparent;min-height:38px}
.seg button.on{background:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){.seg button.on{color:#111}}
.sent{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;border:1px solid transparent;transition:background .2s}
.sent.on{background:var(--accs);border-color:var(--acc)}
.sent .t{flex:1;min-width:0}
.ko{color:var(--tx2);margin-top:3px}
.eo-t{cursor:pointer}
.player{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.player .now{font-size:14px;color:var(--tx2)}
.player .now b{color:var(--tx)}
.bar{height:6px;background:var(--line);border-radius:3px;margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
.cue{color:var(--acc);font-weight:600;margin:4px 0;display:none}
.cue.show{display:block;animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
label.tg{display:inline-flex;gap:8px;align-items:center;font-size:15px}
label.tg input{width:22px;height:22px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl td,.tbl th{word-break:keep-all;overflow-wrap:normal;hyphens:manual;-webkit-hyphens:manual;border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.tbl th{font-size:13px;color:var(--tx2);font-weight:600}
.tbl tr.on td{background:var(--accs)}
/* word / expression lists: grid rows on desktop, one card per item on phones; never split words */
.items{margin:6px 0;font-size:15px}
.items,.items *{word-break:keep-all;overflow-wrap:normal;hyphens:manual;-webkit-hyphens:manual}
.item{display:grid;grid-template-columns:minmax(9em,1.2fr) minmax(7em,1fr) 2fr auto;grid-template-areas:"w mean ex acts";gap:2px 12px;align-items:start;padding:9px 8px;border-bottom:1px solid var(--line);border-radius:8px;transition:background .2s}
.item.ihdr{font-size:13px;color:var(--tx2);font-weight:600;padding-top:4px;padding-bottom:4px}
.item.on{background:var(--accs)}
.item .w{grid-area:w;min-width:0}.item .w b{font-size:16px}
.item .pos{color:var(--tx2);font-size:13px;margin-left:6px;white-space:nowrap}
.item .mean{grid-area:mean;min-width:0}
.item .ex{grid-area:ex;min-width:0}
.item .acts{grid-area:acts;display:flex;gap:6px;justify-content:flex-end;white-space:nowrap}
.item .acts button{min-width:40px}
@media (max-width:600px){
  .item{grid-template-columns:1fr auto;grid-template-areas:"w acts" "mean mean" "ex ex";border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;gap:4px 8px}
  .item.ihdr{display:none}
  .item .w{align-self:center}
  .item .mean{font-size:16px}
  .item .ex{font-size:13.5px}
}
.ex{color:var(--tx2);font-size:14px}
.card{display:block;border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-decoration:none;color:var(--tx);margin:8px 0}
.card small{color:var(--tx2);display:block}
.q{margin:14px 0;padding-top:6px}
.q .opt{margin:2px 0}
.fb{margin:6px 0}
.okc{color:var(--ok);font-weight:600}.badc{color:var(--bad);font-weight:600}
.note{font-size:14px;color:var(--tx2)}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--tx2)}
.wbstar{font-size:18px}
/* ---------- study area: sticky article switcher + tabs, one panel at a time ---------- */
#study{margin:18px 0}
.sbar{position:sticky;top:0;z-index:15;background:var(--bg);padding:8px 0 6px;margin:0 -4px;padding-left:4px;padding-right:4px;border-bottom:1px solid var(--line)}
.artsw{display:flex;gap:6px;margin-bottom:6px}
.artsw button{flex:1;min-width:0;text-align:left;font-size:14px;line-height:1.3;padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artsw button b{margin-right:4px}
.artsw button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
@media (prefers-color-scheme:dark){.artsw button.on{color:#111}}
.tabs{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;min-height:42px;padding:6px 2px;font-weight:600;color:var(--tx2)}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button.on{background:var(--accs);color:var(--acc);box-shadow:inset 0 -3px 0 var(--acc)}
#study section.art{margin:12px 0}
#pagev section.box{margin:12px 0}
.artsw button.pv{flex:0 0 auto}
#study section.art:not(.cur){display:none}
.art .pn{display:none}
.art[data-pn="read"] .pn-read,.art[data-pn="voc"] .pn-voc,.art[data-pn="exp"] .pn-exp,.art[data-pn="quiz"] .pn-quiz{display:block}
.pn>h3:first-child{margin-top:4px;padding-top:0;border-top:0}
.sent{scroll-margin-top:130px;scroll-margin-bottom:110px}
/* compact sticky mini-player for the full article */
#mini{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.08);padding:6px 10px calc(6px + env(safe-area-inset-bottom))}
#mini .mp{max-width:720px;margin:0 auto}
#mini .mp:not(.cur){display:none}
#mini .player{border:0;margin:0;padding:0}
#mini .mrow{display:flex;align-items:center;gap:6px}
#mini .mrow .lbl{flex:1;min-width:0;font-size:13px;color:var(--tx2);line-height:1.3;overflow:hidden}
#mini .mrow .lbl b{display:block;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini button{min-height:38px;padding:6px 9px;font-size:14px}
#mini .fpp{min-width:46px}
#mini .bar{margin:5px 0 1px;height:5px}
.wrap{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
#tabs[hidden],#pagev[hidden]{display:none}
/* compact sticky control bar (어휘/표현 tabs): play-all + 반복 + 간격, right under the tab bar */
.ctl{position:sticky;top:var(--sbh,104px);z-index:12;background:var(--card);margin:6px -16px 10px;padding:8px 12px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:0 6px 10px -8px rgba(0,0,0,.18)}
.ctl .crow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.ctl .crow button{min-height:38px;padding:6px 9px;font-size:14px;flex:0 0 auto}
.ctl .crow .pp{min-width:46px}
.ctl .now{font-size:13px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx2)}
.ctl .now b{color:var(--tx)}
@media (max-width:400px){.ctl .crow{gap:4px}.ctl .crow button{padding:6px 7px;font-size:13px}.ctl .crow .pp{min-width:42px}}
.ctl .crow2{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:6px;font-size:13px}
.ctl .crow2 .seg{margin:0}
.ctl .crow2 .seg button{min-height:32px;padding:4px 7px;font-size:13px}
@media (max-width:400px){.ctl .crow2{gap:4px}.ctl .crow2 .seg button{padding:4px 5px}}
.ctl .crow2 .lab{color:var(--tx2)}
.ctl .bar{height:3px;margin:8px -12px 0;border-radius:0}
figure.hero{margin:6px 0 14px}
figure.hero img{display:block;width:100%;height:auto;border-radius:10px;background:var(--line)}
figure.hero figcaption{font-size:13px;color:var(--tx2);margin-top:6px;line-height:1.45;word-break:keep-all}
figure.hero .credit{white-space:nowrap}
figure.hero .credit a{color:var(--tx2)}
@media (max-width:600px){figure.hero{margin-left:-16px;margin-right:-16px}figure.hero img{border-radius:0}figure.hero figcaption{padding:0 16px}}
.toplinks{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.toplinks a{flex:1;min-width:140px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header class="mast">
  <div class="date"><a href="./index.html" style="color:inherit">← 전체 학습 목록</a></div>
  <h1>⭐ 나만의 단어장</h1>
  <p>날짜별 페이지에서 ☆로 저장한 단어와 중요 표현이 모여요. 🔊는 영어 → 뜻을 번갈아 읽어 줍니다. 맨 위 막대에서 ▶ 전체 듣기, 반복 1~3회·간격을 정할 수 있어요.</p>
</header>
<section class="box">
  <span class="seg" id="filt"><button data-f="all" class="on">전체</button><button data-f="word">단어</button><button data-f="expr">표현</button></span>
  <span class="seg" id="modes"><button data-m="list" class="on">📋 목록</button><button data-m="quiz">📝 복습 퀴즈</button></span>
  <div id="cnt" class="note"></div>
  <div class="player ctl" id="wbctl" style="top:0">
    <div class="crow">
      <button class="pri pp" id="wbpp" aria-label="전체 재생/일시정지">▶</button>
      <button id="wbstop" aria-label="정지">⏹</button>
      <button id="wbprev" aria-label="이전">⏮</button>
      <button id="wbnext" aria-label="다음">⏭</button>
      <div class="now" id="wbnow"></div>
    </div>
    <div class="crow2" id="gapbox"></div>
    <div class="bar"><i></i></div>
  </div>
  <div id="list"></div>
  <div id="quiz" hidden></div>
</section>
<section class="box">
  <h3 style="border:0;margin-top:0;padding-top:0">백업 · 옮기기</h3>
  <div class="note">단어장은 이 기기의 이 브라우저에만 저장돼요. 내보내기로 글자를 복사해 메모 등에 보관하고, 다른 기기에서 가져오기에 붙여 넣으면 합쳐집니다.</div>
  <div class="row"><button id="exp">⬆ 내보내기</button><button id="copy">📋 복사</button><button id="imp">⬇ 가져오기</button></div>
  <textarea id="io" rows="6" style="width:100%;font:13px/1.4 ui-monospace,monospace;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px" placeholder="내보내기를 누르면 여기에 백업 글자가 나와요. 가져오려면 백업 글자를 붙여 넣고 가져오기를 누르세요."></textarea>
  <div id="iomsg" class="note"></div>
</section>
</div>
<script src="./wb.js?v=e4b9d9c2fe"></script>
<script>fetch("./days.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{ const v=j&&j.assets&&j.assets.wordbook; if(v&&v!=="0452951bb7") freshen(v); }).catch(()=>{});</script>
<script>
const esc = WB.esc;
let filt="all", mode="list", qz=null;
document.getElementById("gapbox").innerHTML = WB.gapHTML();
// play-all bar: plays the list as currently shown (filter applied), top to bottom
const shown = () => WB.all().filter(x=>filt==="all"||x.type===filt).map(x=>({id:x.id, url:x.clip}));
document.getElementById("wbpp").onclick = () => WB.toggleList(shown());
document.getElementById("wbstop").onclick = () => WB.stop();
document.getElementById("wbprev").onclick = () => WB.jump(shown(), -1);
document.getElementById("wbnext").onclick = () => WB.jump(shown(), 1);
function drawCtl(){ const st=WB.listState(), items=WB.all().filter(x=>filt==="all"||x.type===filt), n=items.filter(x=>x.clip).length;
  document.getElementById("wbctl").hidden = mode!=="list" || !n;
  document.getElementById("wbpp").textContent = st.active && !st.paused ? "⏸" : "▶";
  const it = st.active ? items.find(x=>x.id===st.id) : null;
  document.getElementById("wbnow").innerHTML = it ? `<b>${st.li+1}/${st.n}</b> ${esc(it.en)}` : `<b>전체 ${n}개</b> 듣기`;
  document.querySelectorAll("#list .item[data-id]").forEach(r=>r.classList.toggle("on", WB.isPlaying(r.dataset.id))); }
const typeName = t => t==="expr"?"표현":"단어";
function drawList(){
  const all=WB.all(), items=all.filter(x=>filt==="all"||x.type===filt);
  document.getElementById("cnt").textContent = `저장 ${all.length}개 (단어 ${all.filter(x=>x.type==="word").length} · 표현 ${all.filter(x=>x.type==="expr").length})`;
  if(mode!=="list") return;
  document.getElementById("list").innerHTML = items.length ? `<div class="items"><div class="item ihdr"><div class="w">영어</div><div class="mean">뜻</div><div class="ex">기사 · 날짜</div><div class="acts"></div></div>` + items.map(x=>`<div class="item" data-id="${esc(x.id)}">
    <div class="w"><b>${esc(x.en)}</b><span class="pos">${typeName(x.type)}${x.pos?" · "+esc(x.pos):""}</span></div>
    <div class="acts"><button class="ico" data-play="${esc(x.id)}" aria-label="듣기">${WB.isPlaying(x.id)?"⏸":"🔊"}</button><button class="ico" data-del="${esc(x.id)}" aria-label="삭제">🗑</button></div>
    <div class="mean">${esc(x.ko)}</div>
    <div class="ex">${x.ex?esc(x.ex)+"<br>":""}${x.article?esc(x.article)+" · ":""}${x.date?(x.page?`<a href="${esc(x.page)}">${esc(x.date)}</a>`:esc(x.date)):""}</div></div>`).join("") + `</div>`
    : `<div class="note">${all.length?"이 종류로 저장한 항목이 없어요.":"아직 비어 있어요. 날짜별 페이지의 주요 어휘·중요 표현 표에서 ☆를 눌러 저장해 보세요."}</div>`;
}
document.getElementById("list").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return;
  const all=WB.all();
  if(b.dataset.play){ const x=all.find(i=>i.id===b.dataset.play); if(x) WB.play(x.clip, x.id); }
  if(b.dataset.del){ const x=all.find(i=>i.id===b.dataset.del); if(x && confirm(`'${x.en}'을(를) 단어장에서 뺄까요?`)) WB.remove(x.id); } });
document.getElementById("filt").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; filt=b.dataset.f;
  document.querySelectorAll("#filt button").forEach(x=>x.classList.toggle("on",x===b)); if(qz) qz.setType(filt); drawList(); drawCtl(); });
document.getElementById("modes").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; mode=b.dataset.m;
  document.querySelectorAll("#modes button").forEach(x=>x.classList.toggle("on",x===b));
  document.getElementById("list").hidden = mode!=="list"; document.getElementById("quiz").hidden = mode!=="quiz";
  if(mode==="quiz"){ if(!qz) qz=WB.quiz(document.getElementById("quiz"),{limit:10,type:filt}); else qz.setType(filt); }
  drawList(); drawCtl(); });
const io=document.getElementById("io"), msg=t=>document.getElementById("iomsg").textContent=t;
document.getElementById("exp").onclick=()=>{ io.value=WB.exportText(); io.select(); msg(`${WB.all().length}개를 내보냈어요. 복사해서 보관하세요.`); };
document.getElementById("copy").onclick=()=>{ if(!io.value) io.value=WB.exportText(); io.select();
  (navigator.clipboard?navigator.clipboard.writeText(io.value):Promise.reject()).then(()=>msg("복사했어요."),()=>{ document.execCommand&&document.execCommand("copy"); msg("글자를 선택했어요. 복사해 주세요."); }); };
document.getElementById("imp").onclick=()=>{ try{ const n=WB.importText(io.value.trim()); msg(`${n}개를 새로 가져왔어요 (이미 있던 항목은 건너뜀).`); }catch(e){ msg("가져오기 실패: "+e.message); } };
WB.onChange(drawList); WB.onChange(drawCtl); drawList(); drawCtl();
</script>
</body>
</html>
